<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>فيس بوك</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --bg:#F0F2F5; --card:#fff; --ink:#050505; --muted:#65676B; --blue:#1877F2; --line:#CED0D4; --soft:#E4E6EB; --size:17px; }
  body.dark { --bg:#18191A; --card:#242526; --ink:#E4E6EB; --muted:#B0B3B8; --blue:#2D88FF; --line:#3E4042; --soft:#3A3B3C; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",Tahoma,Arial,sans-serif; font-size:var(--size); line-height:1.5; }
  svg.ic { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto; }
  button { font:inherit; color:inherit; }
  button:focus-visible, .lp:focus-visible, input:focus-visible { outline:3px solid var(--blue); outline-offset:2px; }

  header { background:var(--card); position:sticky; top:0; z-index:10; transition:transform .25s ease; }
  header.hide { transform:translateY(-56px); }
  .bar { height:56px; padding:0 12px; display:flex; align-items:center; justify-content:space-between; }
  .logo { color:var(--blue); font-weight:800; font-size:1.75em; letter-spacing:-.5px; line-height:1; }
  .tools { display:flex; gap:8px; }
  .tools button { width:40px; height:40px; border:0; border-radius:50%; background:var(--soft); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .tabs { display:flex; border-bottom:1px solid var(--line); }
  .tabs button { flex:1; height:50px; border:0; border-bottom:3px solid transparent; background:none; color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .tabs button svg { width:24px; height:24px; }
  .tabs button[aria-pressed="true"] { color:var(--blue); border-bottom-color:var(--blue); }
  .tabs button[aria-pressed="true"] svg { fill:currentColor; fill-opacity:.15; }
  .sbar { display:none; padding:8px 12px; background:var(--card); border-bottom:1px solid var(--line); }
  .sbar.show { display:block; }
  .sbar input { width:100%; height:40px; border:0; border-radius:20px; padding:0 16px; background:var(--soft); color:var(--ink); font:inherit; font-size:.95em; }

  main { max-width:680px; margin:0 auto; padding-bottom:40px; }
  .composer { background:var(--card); display:flex; align-items:center; gap:8px; padding:10px 12px; margin-bottom:8px; }
  .av { border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; flex:0 0 auto; }
  .composer .av { width:40px; height:40px; background:var(--blue); }
  .composer .pill { flex:1; height:40px; border:1px solid var(--line); border-radius:20px; background:none; color:var(--muted); text-align:right; padding:0 14px; font-size:.95em; cursor:pointer; }
  .composer .photo { width:40px; height:40px; border:0; background:none; color:#45BD62; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .cbox { display:none; background:var(--card); padding:0 12px 12px; margin:-8px 0 8px; }
  .cbox.show { display:block; }
  .cbox textarea { width:100%; min-height:90px; border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--card); color:var(--ink); font:inherit; resize:vertical; }
  .cbox button { margin-top:8px; width:100%; height:42px; border:0; border-radius:8px; background:var(--blue); color:#fff; font-weight:700; cursor:pointer; }

  .stories { display:flex; gap:8px; overflow-x:auto; padding:10px 12px 12px; background:var(--card); margin-bottom:8px; scrollbar-width:none; }
  .stories::-webkit-scrollbar { display:none; }
  .st { flex:0 0 auto; width:104px; height:178px; border:0; border-radius:12px; position:relative; overflow:hidden; cursor:pointer; padding:0; color:#fff; text-align:right; box-shadow:0 1px 3px rgba(0,0,0,.25); }
  .st .sa { position:absolute; top:8px; right:8px; width:38px; height:38px; border:3px solid var(--blue); background:rgba(0,0,0,.25); font-size:.7em; }
  .st .sn { position:absolute; bottom:8px; right:8px; left:8px; font-size:.78em; font-weight:700; line-height:1.3; text-shadow:0 1px 3px rgba(0,0,0,.6); }
  .st[aria-pressed="true"] { outline:3px solid var(--blue); outline-offset:-3px; }
  .st.create { background:var(--card); color:var(--ink); border:1px solid var(--line); box-shadow:none; }
  .st.create .top { height:68%; background:var(--soft); display:flex; align-items:center; justify-content:center; }
  .st.create .top .av { width:62px; height:62px; background:var(--blue); font-size:1.4em; }
  .st.create .plus { position:absolute; top:calc(68% - 16px); left:50%; transform:translateX(-50%); width:32px; height:32px; border-radius:50%; background:var(--blue); color:#fff; border:3px solid var(--card); display:flex; align-items:center; justify-content:center; }
  .st.create .plus svg { width:18px; height:18px; stroke-width:3; }
  .st.create .sn { text-shadow:none; bottom:10px; text-align:center; }

  article { background:var(--card); margin-bottom:8px; position:relative; }
  @media (min-width:700px){ article,.stories,.composer{ border-radius:10px; } }
  .head { display:flex; align-items:center; gap:8px; padding:12px 12px 6px; }
  .head .av { width:40px; height:40px; font-size:.8em; }
  .hm { flex:1; min-width:0; }
  .name { font-weight:700; line-height:1.25; font-size:.95em; }
  .when { color:var(--muted); font-size:.78em; line-height:1.3; display:flex; align-items:center; gap:4px; }
  .when svg { width:12px; height:12px; stroke-width:2.2; }
  .hb { display:flex; }
  .hb button { width:36px; height:36px; border:0; background:none; color:var(--muted); font-size:1.1em; border-radius:50%; cursor:pointer; }
  .hb button:active { background:var(--soft); }
  .text { padding:2px 12px 10px; font-size:1em; line-height:1.55; white-space:pre-line; }
  .text:empty { display:none; }
  .lp { cursor:pointer; background:var(--soft); }
  .lp img { display:block; width:100%; max-height:360px; object-fit:cover; background:var(--line); }
  .lpb { padding:8px 12px 10px; }
  .dom { color:var(--muted); font-size:.72em; text-transform:uppercase; letter-spacing:.2px; direction:ltr; text-align:right; }
  .lpt { font-weight:600; font-size:.98em; line-height:1.5; }
  .vid { position:relative; cursor:pointer; background:#000; }
  .vid img { display:block; width:100%; max-height:360px; object-fit:cover; opacity:.92; }
  .vid .play { position:absolute; inset:0; margin:auto; width:64px; height:64px; border-radius:50%; background:rgba(0,0,0,.6); color:#fff; display:flex; align-items:center; justify-content:center; font-size:1.8em; }
  .vid iframe { display:block; width:100%; aspect-ratio:16/9; border:0; }
  .counts { display:flex; justify-content:space-between; color:var(--muted); font-size:.82em; padding:8px 12px 6px; min-height:6px; }
  .counts:empty { display:none; }
  .actions { display:flex; border-top:1px solid var(--line); margin:0 12px; padding:2px 0; }
  .actions button { flex:1; height:44px; border:0; background:none; color:var(--muted); font-weight:600; font-size:.88em; border-radius:6px; display:flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; user-select:none; -webkit-user-select:none; }
  .actions button svg { width:21px; height:21px; }
  .actions button:active { background:var(--soft); }
  .actions button.on { color:var(--blue); }
  .react-pick { display:none; position:absolute; right:12px; bottom:52px; background:var(--card); border-radius:40px; box-shadow:0 2px 12px rgba(0,0,0,.35); padding:6px 8px; z-index:3; }
  .react-pick.show { display:flex; }
  .react-pick button { border:0; background:none; font-size:1.8em; cursor:pointer; padding:0 5px; line-height:1.3; }
  .comments { display:none; padding:4px 12px 12px; }
  .comments.show { display:block; }
  .cm { display:flex; gap:8px; margin-bottom:8px; align-items:flex-start; }
  .cm .av { width:32px; height:32px; background:var(--blue); font-size:.75em; }
  .cm .bub { background:var(--soft); border-radius:18px; padding:6px 12px; font-size:.9em; }
  .cm .bub b { display:block; font-size:.9em; }
  .cm-form { display:flex; gap:8px; margin-top:6px; }
  .cm-form input { flex:1; height:42px; border:0; border-radius:21px; padding:0 14px; background:var(--soft); color:var(--ink); font:inherit; font-size:.92em; }
  .cm-form button { height:42px; padding:0 16px; border:0; border-radius:21px; background:var(--blue); color:#fff; font-weight:700; cursor:pointer; }

  .state { text-align:center; padding:36px 16px; color:var(--muted); }
  .morebtn { display:block; width:calc(100% - 24px); margin:4px 12px 8px; height:44px; border:0; border-radius:8px; background:var(--soft); color:var(--blue); font-weight:700; cursor:pointer; }
  .retry { margin-top:12px; height:42px; padding:0 22px; border:0; border-radius:8px; background:var(--blue); color:#fff; font-weight:700; cursor:pointer; }
  .caught { text-align:center; padding:26px 16px; color:var(--muted); font-size:.9em; }
  .caught svg { width:40px; height:40px; color:var(--blue); display:block; margin:0 auto 6px; }
  .wcard { background:var(--card); margin-bottom:8px; padding:6px 12px 10px; }
  .wrow { padding:8px 0; border-bottom:1px solid var(--line); }
  .wrow:last-child { border-bottom:0; }
  .wrow:empty { display:none; }
  .wlabel { color:var(--muted); font-size:.75em; margin-bottom:4px; }
  .wtop { display:flex; align-items:center; gap:10px; }
  .wtop .big { font-size:2em; line-height:1; }
  .wtop b { font-size:1.05em; }
  .wtop span { color:var(--muted); font-size:.85em; }
  .chips { display:flex; gap:6px; }
  .chip { flex:1; text-align:center; background:var(--bg); border-radius:10px; padding:4px 2px; line-height:1.3; }
  .chip small { display:block; color:var(--muted); font-size:.7em; }
  .chip b { font-size:.88em; direction:ltr; display:inline-block; }
  .chip.next { background:var(--blue); color:#fff; }
  .chip.next small { color:#fff; opacity:.9; }
  .prices { display:flex; gap:8px; }
  .prices div { flex:1; background:var(--bg); border-radius:10px; padding:6px 10px; line-height:1.35; }
  .prices small { display:block; color:var(--muted); font-size:.7em; }
  .prices b { font-size:.95em; }
  .wnote { color:var(--muted); font-size:.68em; margin-top:4px; }
  article img.pic { display:block; width:100%; max-height:360px; object-fit:cover; background:var(--line); }
  .sk { background:var(--card); margin-bottom:8px; padding:14px 12px; }
  .sk i { display:block; background:var(--soft); border-radius:8px; margin-bottom:10px; animation:pulse 1.2s ease-in-out infinite; }
  .sk .r1 { display:flex; gap:10px; align-items:center; margin-bottom:12px; } .sk .r1 i:first-child { width:40px; height:40px; border-radius:50%; margin:0; } .sk .r1 i:last-child { width:40%; height:14px; margin:0; }
  .sk .l1 { height:14px; width:92%; } .sk .l2 { height:14px; width:70%; } .sk .l3 { height:160px; border-radius:0; margin:12px -12px 0; }
  @keyframes pulse { 50% { opacity:.5; } }
  .clamp { display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
  .seemore { border:0; background:none; color:var(--muted); font-weight:700; padding:0 12px 8px; font-size:.9em; cursor:pointer; }
  .vid.reelbox { aspect-ratio:9/16; max-height:78vh; margin:0 auto; }
  .vid.reelbox img { width:100%; height:100%; max-height:none; object-fit:cover; }
  .vid.reelbox iframe { width:100%; height:100%; aspect-ratio:auto; }
  .newpill { position:fixed; top:116px; left:50%; transform:translateX(-50%); z-index:15; display:none; background:var(--blue); color:#fff; border:0; border-radius:20px; padding:8px 18px; font-weight:700; box-shadow:0 2px 8px rgba(0,0,0,.3); cursor:pointer; }
  .embed { position:fixed; inset:0; z-index:40; background:var(--bg); display:flex; flex-direction:column; }
  .embed[hidden] { display:none; }
  .ebar { height:56px; padding:0 8px; display:flex; align-items:center; gap:8px; background:var(--card); border-bottom:1px solid var(--line); flex:0 0 auto; }
  .ebar button { width:44px; height:44px; border:0; border-radius:50%; background:var(--soft); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .ebar .et { flex:1; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ebody { flex:1; min-height:0; display:flex; justify-content:center; background:var(--card); }
  .ebody iframe { border:0; max-width:100%; background:#fff; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:10px 20px; border-radius:24px; font-size:.85em; display:none; z-index:30; }
</style>
</head>
<body>
<header id="hdr">
  <div class="bar">
    <div class="logo">فيس بوك</div>
    <div class="tools">
      <button id="bplus" aria-label="إنشاء"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="bmsg" aria-label="ماسنجر"><svg class="ic" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></button>
    </div>
  </div>
  <nav class="tabs" id="cats" aria-label="الأقسام"></nav>
</header>

<main>
  <div class="composer" id="composer">
    <div class="av" id="meav"></div>
    <button class="pill" id="openbox"></button>
    <button class="photo" id="photo" aria-label="صورة"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg></button>
  </div>
  <div class="cbox" id="cbox"><textarea id="ctext" placeholder="شو عم يدور ببالك؟" aria-label="منشور جديد"></textarea><button id="cpost">نشر</button></div>
  <nav class="stories" id="stories" aria-label="الصفحات"></nav>
  <div id="list"></div>
</main>
<button class="newpill" id="newpill">↑ أخبار جديدة</button>
<div class="embed" id="embed" role="dialog" aria-modal="true" aria-labelledby="etitle" hidden>
  <div class="ebar">
    <button id="eback" aria-label="رجوع"><svg class="ic" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <div class="et" id="etitle"></div>
  </div>
  <div class="ebody" id="ebody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ الإعدادات ============ */
const USER_NAME = "حسن علي";   /* الاسم اللي بيظهر بالتطبيق */
const CITY = "تعنيتا - طرطوس";   /* اسم المنطقة اللي بيظهر. الإحداثيات تحت هي لتعنيتا */
const CITIES = { "تعنيتا - طرطوس":[35.109851,36.049515], "دمشق":[33.5138,36.2765], "حلب":[36.2021,37.1343], "حمص":[34.7324,36.7137], "حماة":[35.1318,36.7578], "اللاذقية":[35.5317,35.7898], "طرطوس":[34.8890,35.8866], "إدلب":[35.9306,36.6339], "دير الزور":[35.3359,40.1408], "الرقة":[35.9528,39.0079], "درعا":[32.6189,36.1021], "الحسكة":[36.5024,40.7477], "السويداء":[32.7090,36.5695] };
/* نصيحة جديدة كل يوم، بتتبدل لحالها. عدّل أو أضف متل ما بدك */
const TIPS = [
  "إذا إجتك رسالة بتقلك إنك ربحت جائزة وإنت ما شاركت بشي، هاي نصب. تجاهلها.",
  "ما حدا بيعطي مصاري لحدا ما بيعرفو. إذا وحدة غريبة طلبت منك مصاري أو هدية، هاد نصب.",
  "كود التفعيل اللي بيجيك برسالة ما بتعطيه لحدا أبداً، حتى لو قال إنو من البنك أو شركة الاتصالات.",
  "قبل ما ترد على أي حدا غريب بالإنترنت، احكي لحدا من العيلة.",
  "الصفحات اللي بتوعدك بأرباح سريعة أو جوائز كبيرة كلها نصب.",
  "رابط جاي من حدا ما بتعرفو؟ لا تضغط عليه.",
  "ما تحوّل مصاري لحدا قبل ما تتأكد منو بالتلفون وتسأل عنو.",
  "إذا اتصل فيك حدا وقال إنو من البنك أو من الشرطة وطلب معلومات منك، سكّر الخط وخبّر عيلتك.",
  "اللي بيحبك بجد بيعرّفك على أهلو، مو بيطلب منك مصاري.",
  "كلمة السر ما بتعطيها لحدا، ولا حتى لحدا بيقلك إنو من الدعم الفني.",
  "صور أو فيديوهات من حدا ما بتعرفو وبعدين بيطلب مصاري؟ هاد ابتزاز. لا ترد وخبّر ابنك.",
  "قبل ما تشارك أي خبر، تأكد إنو من مصدر معروف.",
  "الحساب اللي بيضيفك وبيبعتلك رسائل حلوة فجأة غالباً حساب وهمي.",
  "ما في شي اسمو ربح مضمون. اللي بيقلك هيك بدو يخدعك.",
  "إذا حسيت بشي مو مظبوط، وقّف وسأل حدا بتثق فيه. ما في استعجال.",
  "اللي بيقلك «استعجل، العرض بينتهي اليوم» بدو يخليك ما تفكر. خد وقتك.",
  "حدا بيحكيك فجأة وبيقلك إنو مسافر أو بحاجة مساعدة ومصاري؟ غالباً نصب.",
  "ما تبعت صورة هويتك أو بطاقتك لأي حدا عالإنترنت.",
  "رقم بطاقة البنك والرقم السري ما بيعطيهم الواحد لحدا، ولا بيكتبهم برسالة.",
  "إذا قالك حدا «حوّلي مبلغ صغير وبرجعلك ضعفو»، هاد نصب مشهور.",
  "لا تثبّت تطبيق إجاك رابطو من حدا. نزّل التطبيقات من المتجر الرسمي بس.",
  "الشركات والبنوك الحقيقية ما بتطلب منك كلمة السر ولا كود الرسالة، أبداً.",
  "رسالة فيها أخطاء كتيرة وبتقلك «عاجل» أو «حسابك رح ينسكر»؟ غالباً نصب.",
  "قبل ما تصدق خبر صادم، دور عليه عند أكتر من مصدر معروف.",
  "ما تعطي حدا غريب مكانك أو مواعيد خروجك أو أخبار عيلتك.",
  "إذا حدا بدو مصاري «لجمعية» أو «لمريض»، اسأل عن الجهة بنفسك قبل ما تحوّل.",
  "اشرب مي بالنهار بشكل منتظم، حتى لو ما حسيت بالعطش.",
  "مشوار خفيف كل يوم، ولو عشر دقايق، بيفيد جسمك ومزاجك.",
  "خد دواءك بمواعيدو، ولا توقفو من حالك قبل ما تسأل الدكتور.",
  "إذا نسيت جرعة دواء، ما تضاعف الجرعة الجاية. اسأل الدكتور أو الصيدلاني.",
  "نوم منتظم بيريّح الجسم. حاول تنام وتصحى بنفس الوقت كل يوم.",
  "القهوة أو الشاي بكتير آخر النهار ممكن يخلوا النوم صعب.",
  "خلّي قايمة أدويتك معك، وقول للدكتور عن كل شي بتاخدو.",
  "إذا حسيت بوجع صدر أو ضيق نفس أو دوخة قوية، اتصل بالإسعاف أو بحدا من العيلة فوراً.",
  "قوم ببطء من الكرسي أو السرير، بيمنع الدوخة والوقعة.",
  "خلّي البيت منوّر، وما تترك سجاد أو أسلاك بالممر، بتمنع الوقعات.",
  "الجلوس بالشمس شوي بالصباح بيفيد المزاج والعظام.",
  "اتصل بأهلك وأصحابك، مكالمة وحدة ممكن تغيّر يومك.",
  "ما تقعد ساعات طويلة عالموبايل. قوم وتحرك وطل عالشباك شوي.",
  "إذا بدك تعرف عن دواء جديد، اسأل الصيدلاني أو الدكتور، مو أي إعلان أو صفحة.",

function parseDate(s) {
  if (!s) return new Date(0);
  const d = /^\d{4}-\d{2}-\d{2} /.test(s) ? new Date(s.replace(" ", "T") + "Z") : new Date(s);
  return isNaN(d) ? new Date(0) : d;
}
function ago(d) {
  const m = Math.round((Date.now() - d.getTime()) / 60000);
  if (m < 1) return "الآن"; if (m < 60) return m + " د";
  const h = Math.round(m / 60); if (h < 24) return h + " س";
  return Math.round(h / 24) + " ي";
}

/* جلب الـ RSS */
async function fetchT(url, ms = 7000, opts = {}) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
  try { return await fetch(url, { ...opts, signal: c.signal }); } finally { clearTimeout(t); }
}
async function viaRss2Json(url) {
  const r = await fetchT("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(url));
  const j = await r.json();
  if (j.status !== "ok") throw new Error("rss2json");
  return j.items.map((it) => ({ title: it.title, desc: it.description, link: it.link, pub: it.pubDate, img: it.thumbnail || (it.enclosure && it.enclosure.link) || firstImg(it.description) || firstImg(it.content) }));
}
async function viaAllOrigins(url) {
  const r = await fetchT("https://api.allorigins.win/raw?url=" + encodeURIComponent(url) + "&disableCache=true");
  const xml = new DOMParser().parseFromString(await r.text(), "text/xml");
  const items = [...xml.querySelectorAll("item, entry")];
  if (!items.length) throw new Error("allorigins");
  const g = (el, t) => { const n = el.getElementsByTagName(t)[0]; return n ? n.textContent : ""; };
  return items.map((el) => {
    const enc = el.getElementsByTagName("enclosure")[0];
    const th = el.getElementsByTagName("media:thumbnail")[0] || el.getElementsByTagName("media:content")[0];
    const desc = g(el, "description") || g(el, "media:description");
    const lk = el.getElementsByTagName("link")[0];
    return { title: g(el, "title"), desc, link: g(el, "link") || (lk ? lk.getAttribute("href") : ""), pub: g(el, "pubDate") || g(el, "published"), img: (enc && enc.getAttribute("url")) || (th && th.getAttribute("url")) || firstImg(desc) || firstImg(g(el, "content:encoded")) };
  });
}
/* حفظ آخر أخبار عالجهاز لتظهر بدون إنترنت */
const KEEP = "feed:";
let offlineNote = false;
function saveFeed(url, items) { try { localStorage.setItem(KEEP + url, JSON.stringify(items.slice(0, 40))); } catch {} }
function readFeed(url) {
  try { const t = localStorage.getItem(KEEP + url); if (!t) return null; return JSON.parse(t).map((i) => ({ ...i, date: new Date(i.date) })); }
  catch { return null; }
}
const TTL_MS = 5 * 60 * 1000;          /* ما نعيد الجلب إذا الخبر أحدث من 5 دقايق */
const AGE_DAYS = { news: 3, sport: 3, fun: 7, health: 14, agri: 30, video: 30, reel: 3650 };   /* أقدم عمر مسموح للخبر بالأيام */
const cacheT = {};
function fbText(html) {
  const h = (html || "").replace(/<iframe[\s\S]*?<\/iframe>/gi, "").replace(/<img[^>]*>/gi, "")
    .replace(/<span[^>]*>\s*\(Feed generated with[\s\S]*?<\/span>/gi, "").replace(/<br\s*\/?>\s*/gi, "\n");
  const d = document.createElement("div"); d.innerHTML = h;
  return (d.textContent || "").replace(/\(Feed generated with[^)]*\)/gi, "").replace(/https?:\/\/\S+/g, "")
    .replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim();
}
function toItems(f, raw) {
  if (f.fb) {
    return raw.map((it) => ({ txt: fbText(it.desc), it })).filter((x) => x.txt.length > 3).map(({ txt, it }) => ({
      page: f.page, src: "", plain: true, by: "", summary: txt, title: txt.slice(0, 60), img: "", link: "fb:" + (it.link || txt.slice(0, 30)),
      date: parseDate(it.pub), vid: "", reel: false, topic: "", cat: "news", fb: true
    }));
  }
  return raw.map((it) => {
    let title = clean(it.title), summary = clean(it.desc).slice(0, 180);
    let src = "";
    if (f.gn) { const m = /\s+-\s+([^-]+)$/.exec(title); if (m) src = m[1].trim(); title = title.replace(/\s+-\s+[^-]+$/, ""); summary = ""; }
    const vm = /(?:v=|\/embed\/|youtu\.be\/|\/shorts\/)([\w-]{11})/.exec(it.link || "");
    return { page: f.page, src, title, summary, link: it.link, img: it.img || "", date: parseDate(it.pub),
             vid: (f.cat === "video" || f.cat === "reel") && vm ? vm[1] : "", reel: f.cat === "reel", topic: f.topic || "",
             cat: f.cat !== "news" ? f.cat : classify(title + " " + summary) };
  });
}
/* الأخبار الجاهزة: ملف feeds.json بيتحدّث لحالو كل 15 دقيقة من GitHub Actions */
const BUNDLE_MAX_AGE = 8 * 3600 * 1000;   /* إذا الملف أقدم من 8 ساعات نعتبره معطّل ونرجع للطريقة القديمة */
let bundle = null, bundleAt = 0, bundleP = null;
function loadBundle() {
  if (bundleP && Date.now() - bundleAt < 4 * 60 * 1000) return bundleP;
  bundleAt = Date.now();
  bundleP = fetchT("feeds.json", 10000, { cache: "no-cache" })
    .then((r) => (r.ok ? r.json() : null)).catch(() => null)
    .then((j) => { if (j && j.feeds && Date.now() - Date.parse(j.updated) < BUNDLE_MAX_AGE) bundle = j; else if (!bundle) bundle = null; return bundle; });
  return bundleP;
}
async function fetchRaw(url, onLate) {
  const b = await loadBundle(), hit = b && b.feeds[url];
  if (hit && hit.length) return hit;
  return fetchProxies(url, onLate);   /* مصدر جديد ما وصل للملف بعد، أو الملف معطّل */
}
/* الطريقة القديمة (احتياط): بنجيب من الخدمتين بنفس الوقت، الأسرع بيظهر أول، وإذا التانية جابت أخبار أحدث بنحدّث */
function fetchProxies(url, onLate) {
  const newest = (r) => Math.max(0, ...r.map((i) => parseDate(i.pub).getTime()));
  return new Promise((resolve, reject) => {
    let done = false, fails = 0, first = null;
    const ok = (r) => {
      if (!done) { done = true; first = r; resolve(r); }
      else if (onLate && newest(r) > newest(first)) onLate(r);
    };
    const bad = (e) => { if (++fails === 2 && !done) reject(e); };
    viaRss2Json(url).then(ok, bad);
    viaAllOrigins(url).then(ok, bad);
  });
}
async function loadFeed(f, force, onLate) {
  if (cache[f.url] && !force && Date.now() - (cacheT[f.url] || 0) < TTL_MS) return cache[f.url];
  let raw;
  try {
    raw = await fetchRaw(f.url, (r) => {
      const items = toItems(f, r); cache[f.url] = items; cacheT[f.url] = Date.now(); saveFeed(f.url, items);
      if (onLate) onLate(items);
    });
  } catch (e) {
    const old = cache[f.url] || readFeed(f.url);
    if (old) { offlineNote = true; cache[f.url] = old; return old; }
    throw e;
  }
  const items = toItems(f, raw);
  cache[f.url] = items; cacheT[f.url] = Date.now(); saveFeed(f.url, items);
  return items;
}

  });
  const like = a.querySelector(".like"); let timer = null, long = false;
  const start = () => { long = false; timer = setTimeout(() => { long = true; pick.classList.add("show"); }, 450); };
  const end = () => clearTimeout(timer);
  like.addEventListener("pointerdown", start); like.addEventListener("pointerup", end);
  like.addEventListener("pointerleave", end); like.addEventListener("pointercancel", end);
  like.addEventListener("contextmenu", (e) => e.preventDefault());
  like.onclick = () => {
    if (long) { long = false; return; }
    const s = st(it.link); s.r = s.r ? "" : "👍"; save(); pick.classList.remove("show"); refreshCounts(a, it.link);
  };

  const cmBox = a.querySelector(".comments"), input = a.querySelector(".cm-form input");
  a.querySelector(".cmt").onclick = () => { cmBox.classList.toggle("show"); if (cmBox.classList.contains("show")) input.focus(); };
  const post = () => { const t = input.value.trim(); if (!t) return; st(it.link).c.push(t); save(); input.value = ""; drawComments(a, it.link); refreshCounts(a, it.link); };
  a.querySelector(".cm-form button").onclick = post;
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") post(); });

  a.querySelector(".shr").onclick = async () => {
    try {
      if (it.plain) { if (navigator.share) await navigator.share({ text: it.summary }); else { await navigator.clipboard.writeText(it.summary); toast("تم نسخ النص"); } }
      else if (navigator.share) await navigator.share({ title: it.title, url: it.link });
      else { await navigator.clipboard.writeText(it.link); toast("تم نسخ الرابط"); }
    } catch {}
  };
  drawComments(a, it.link); refreshCounts(a, it.link);
  return a;
}

/* منشورات المستخدم (محلية) */
function openBox() { $("cbox").classList.add("show"); window.scrollTo({ top: 0, behavior: "smooth" }); $("ctext").focus(); }
$("meav").textContent = USER_NAME.trim().charAt(0);
$("openbox").textContent = "شو عم يدور ببالك يا " + USER_NAME.split(" ")[0] + "؟";
$("openbox").onclick = openBox; $("photo").onclick = openBox; $("bplus").onclick = openBox;
$("bmsg").onclick = () => toast("ما في رسائل جديدة");
$("cpost").onclick = () => {
  const t = $("ctext").value.trim(); if (!t) return;

  $("ctext").value = ""; $("cbox").classList.remove("show"); render();
};
function minePosts() {
  return (state.posts || []).map((p, i) => {
    const a = document.createElement("article");
    a.innerHTML = '<div class="head"><div class="av"></div><div class="hm"><div class="name"></div><div class="when"><span></span> · ' + svg("globe") + '</div></div><div class="hb"><button class="x" aria-label="حذف">✕</button></div></div><div class="text"></div>';

}

/* ===== منشورات العيلة (من ملف family.json) والنصائح اليومية ===== */
function localDate(s) {
  if (!s) return new Date();
  const d = new Date(String(s).replace(" ", "T"));
  return isNaN(d) ? new Date() : d;
}
async function loadFamily() {
  let arr = null;
  try { const r = await fetch("family.json?t=" + Date.now(), { cache: "no-store" }); if (r.ok) arr = await r.json(); } catch {}
  if (Array.isArray(arr)) store.set("family", JSON.stringify(arr));
  else { try { arr = JSON.parse(store.get("family", "[]")); } catch { arr = []; } }
  const withImg = arr.slice().sort((a, b) => localDate(b.date) - localDate(a.date)).find((p) => p.image);
  if (withImg) storyImg.fam = withImg.image;
  return arr.map((p, i) => ({
    page: "fam", plain: true, pin: 1, by: p.by || "", summary: String(p.text || ""), title: String(p.text || "").slice(0, 60),
    img: p.image || "", date: localDate(p.date), link: "fam:" + (p.date || "") + ":" + i, cat: "all"
  })).sort((a, b) => b.date - a.date);
}
function tipItems(k) {
  const day = Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 86400000) - k;
  const out = [];
  for (let j = 0; j < TIPS_PER_DAY; j++) {
    const n = day * TIPS_PER_DAY + j, tip = TIPS[((n % TIPS.length) + TIPS.length) % TIPS.length];
    const d = new Date(); d.setHours(7, j, 0, 0); d.setDate(d.getDate() - k);
    out.push({ page: "tip", plain: true, by: "", summary: (j === 0 ? "نصيحة اليوم: " : "نصيحة: ") + tip, title: tip.slice(0, 60), img: "", date: d, link: "tip:" + n, cat: "all" });
  }
  return out;
}
function oliveItems(days = 1) {
  const now = new Date(), m = now.getMonth(), L = OLIVE_POOL.length;
  const dayNo = Math.floor((Date.now() - now.getTimezoneOffset() * 60000) / 86400000);
  const a = new Date(); a.setHours(9, 0, 0, 0);
  const out = [{ page: "oliv", plain: true, by: "", summary: "🫒 تقويم الزيتون لشهر " + MONTHS[m] + ":\n" + OLIVE_MONTH[m] + "\n\n(إرشادات عامة، واسأل المرشد الزراعي بمنطقتك)", title: "تقويم الزيتون " + MONTHS[m], img: "", date: a, link: "olive-m:" + m + ":" + now.getFullYear(), cat: "agri" }];
  for (let k = 0; k < days; k++) for (let j = 0; j < OLIVE_PER_DAY; j++) {
    const n = (dayNo - k) * OLIVE_PER_DAY + j, [c, t] = OLIVE_POOL[((n % L) + L) % L];
    const d = new Date(); d.setHours(6, j * 5, 0, 0); d.setDate(d.getDate() - k);
    out.push({ page: "oliv", plain: true, by: "", summary: "🫒 " + c + ":\n" + t, title: t.slice(0, 60), img: "", date: d, link: "olive-p:" + n, cat: "agri" });
  }
  return out;
}
async function extras() {
  const out = [];
  if (curCat === "agri" && (curPage === "all" || curPage === "oliv")) out.push(...oliveItems(curPage === "oliv" ? 5 : 2));
  if (curCat !== "all") return out;
  if (curPage === "all") { out.push(...(await loadFamily()).slice(0, 5)); out.push(...tipItems(0)); out.push(...oliveItems()); }
  else if (curPage === "oliv") out.push(...oliveItems(5));
  else if (curPage === "fam") out.push(...(await loadFamily()).slice(0, 30));
  else if (curPage === "tip") for (let k = 0; k < 3; k++) out.push(...tipItems(k));
  return out;
}

/* ===== الطقس ومواعيد الصلاة والأسعار ===== */
async function withSaved(key, fn) {
  try { const v = await fn(); store.set("w:" + key, JSON.stringify({ t: Date.now(), v })); return { v, stale: false }; }
  catch { try { const o = JSON.parse(store.get("w:" + key, "null")); if (o) return { v: o.v, stale: true, t: o.t }; } catch {} return null; }
}
const WCODE = (c) => c === 0 ? ["☀️","صافي"] : c <= 2 ? ["🌤️","غائم جزئياً"] : c === 3 ? ["☁️","غائم"] : c <= 48 ? ["🌫️","ضباب"] : c <= 57 ? ["🌦️","رذاذ"] : c <= 67 ? ["🌧️","مطر"] : c <= 77 ? ["❄️","ثلج"] : c <= 82 ? ["🌧️","زخات مطر"] : ["⛈️","عاصفة رعدية"];
const getWeather = () => withSaved("weather", async () => {
  const [lat, lon] = CITIES[CITY] || CITIES["دمشق"];
  const r = await fetch("https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon + "&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1");
  const j = await r.json();
  return { t: Math.round(j.current.temperature_2m), code: j.current.weather_code, max: Math.round(j.daily.temperature_2m_max[0]), min: Math.round(j.daily.temperature_2m_min[0]) };
});
const getPrayer = () => withSaved("prayer", async () => {
  const [lat, lon] = CITIES[CITY] || CITIES["دمشق"];
  const r = await fetch("https://api.aladhan.com/v1/timings?latitude=" + lat + "&longitude=" + lon + "&method=3");
  const j = await r.json(); const t = j.data.timings; const c = (x) => String(x).slice(0, 5);
  return { Fajr: c(t.Fajr), Dhuhr: c(t.Dhuhr), Asr: c(t.Asr), Maghrib: c(t.Maghrib), Isha: c(t.Isha) };
});
const getPrices = () => withSaved("prices", async () => {
  const out = {};
  try { const r = await fetch("prices.json?t=" + Date.now(), { cache: "no-store" }); if (r.ok) out.manual = await r.json(); } catch {}
  try { const r = await fetch("https://open.er-api.com/v6/latest/USD"); const j = await r.json(); if (j.rates && j.rates.SYP) out.syp = j.rates.SYP; if (j.rates && j.rates.XAU) out.xau = 1 / j.rates.XAU; } catch {}
  try { const r = await fetch("https://api.gold-api.com/price/XAU"); const j = await r.json(); if (j.price) out.xau = j.price; } catch {}
  if (!out.manual && !out.syp && !out.xau) throw new Error("prices");
  return out;
});
const n0 = (x) => Math.round(x).toLocaleString("en-US");
const t12 = (hhmm) => { const [h, m] = hhmm.split(":").map(Number); return ((h % 12) || 12) + ":" + String(m).padStart(2, "0"); };

function buildWidgets() {
  const el = document.createElement("div"); el.className = "wcard";
  el.innerHTML = '<div class="wrow w1"></div><div class="wrow w2"></div><div class="wrow w3"></div>';
  getWeather().then((w) => {
    if (!w) return; const v = w.v, [ic, nm] = WCODE(v.code);
    el.querySelector(".w1").innerHTML = '<div class="wtop"><div class="big"></div><div><b></b><br><span></span></div></div>';
    el.querySelector(".big").textContent = ic;
    el.querySelector("b").textContent = CITY + " · " + v.t + "°";
    el.querySelector(".wtop span").textContent = nm + " · العظمى " + v.max + "° والصغرى " + v.min + "°";
  });
  getPrayer().then((p) => {
    if (!p) return; const v = p.v;
    const list = [["الفجر", v.Fajr], ["الظهر", v.Dhuhr], ["العصر", v.Asr], ["المغرب", v.Maghrib], ["العشاء", v.Isha]];
    const nowM = new Date().getHours() * 60 + new Date().getMinutes();
    let next = list.findIndex(([, t]) => { const [h, m] = t.split(":").map(Number); return h * 60 + m > nowM; }); if (next < 0) next = 0;
    const box = el.querySelector(".w2"); box.innerHTML = '<div class="wlabel">مواعيد الصلاة</div><div class="chips"></div>';
    list.forEach(([nm, t], i) => { const c = document.createElement("div"); c.className = "chip" + (i === next ? " next" : ""); c.innerHTML = "<small></small><b></b>"; c.querySelector("small").textContent = nm; c.querySelector("b").textContent = t12(t); box.querySelector(".chips").appendChild(c); });
  });
  getPrices().then((p) => {
    if (!p) return; const v = p.v, m = v.manual || {}, cells = [];
    if (m.usd_syp) cells.push(["الدولار", n0(m.usd_syp) + " ل.س"]);
    else if (v.syp) cells.push(["الدولار (سعر رسمي)", n0(v.syp) + " ل.س"]);
    if (m.gold21_syp) cells.push(["غرام الذهب عيار 21", n0(m.gold21_syp) + " ل.س"]);
    else if (v.xau) cells.push(["غرام الذهب 21 (عالمي)", "$" + n0(v.xau / 31.1035 * 0.875)]);
    if (!cells.length) return;
    const box = el.querySelector(".w3"); box.innerHTML = '<div class="prices"></div><div class="wnote"></div>';
    cells.forEach(([l, val]) => { const d = document.createElement("div"); d.innerHTML = "<small></small><b></b>"; d.querySelector("small").textContent = l; d.querySelector("b").textContent = val; box.querySelector(".prices").appendChild(d); });
    box.querySelector(".wnote").textContent = m.date ? "آخر تحديث: " + m.date : "الأسعار تقريبية، تأكد من السوق";
  });
  return el;
}

function skeleton() {
  const one = '<div class="sk"><div class="r1"><i></i><i></i></div><i class="l1"></i><i class="l2"></i><i class="l3"></i></div>';
  return one + one;
}
let renderToken = 0, lastRefresh = Date.now();
function showPill(fn) { const b = $("newpill"); b.style.display = "block"; b.onclick = () => { b.style.display = "none"; fn(); }; }
function hidePill() { $("newpill").style.display = "none"; }
const pickFeeds = () => FEEDS.filter((f) => (curPage === "all" || f.page === curPage) && (curCat === "reel" ? f.cat === "reel" : f.cat !== "reel" && (curCat === "all" || f.cat === curCat || f.cat === "news")));

async function render(force, silent) {
  const my = ++renderToken, list = $("list");
  hidePill();
  const feeds = pickFeeds(), extraP = extras(), got = new Map();
  feeds.forEach((f) => { const v = cache[f.url] || readFeed(f.url); if (v) got.set(f.url, v); });
  let painted = !!silent, dirty = false, finished = false, timer = null;
  const doPaint = async () => { if (my !== renderToken) return; await paint(my, [...got.values()].flat(), extraP, finished && got.size === 0); painted = true; dirty = false; };
  const settle = () => {
    const busy = list.contains(document.activeElement) || list.querySelector("iframe");
    if (window.scrollY < 150 && !busy) doPaint(); else showPill(() => { doPaint(); window.scrollTo({ top: 0, behavior: "smooth" }); });
  };
  const arrived = () => {
    if (my !== renderToken) return;
    if (!painted) { clearTimeout(timer); timer = setTimeout(doPaint, 600); }   /* أول ظهور بعد ما توصل كم مصدر */
    else if (finished) settle();
    else dirty = true;
  };
  if (!silent) { if (got.size) await doPaint(); else list.innerHTML = skeleton(); }

  await Promise.all(feeds.map((f) => {
    if (cache[f.url] && !force && Date.now() - (cacheT[f.url] || 0) < TTL_MS) return Promise.resolve();
    return loadFeed(f, force, (items) => { got.set(f.url, items); arrived(); })
      .then((items) => { got.set(f.url, items); arrived(); }).catch(() => {});
  }));
  finished = true;
  if (my !== renderToken) return;
  lastRefresh = Date.now();
  if (!painted) { clearTimeout(timer); await doPaint(); }
  else if (dirty) settle();
}

async function paint(my, feedItems, extraP, allFailed) {
  const list = $("list");
  const cut = (it) => { const t = it.date && it.date.getTime(); return !t || Date.now() - t <= (it.fb ? 14 : (AGE_DAYS[it.cat] ?? 7)) * 86400000; };
  const extra = await extraP;
  if (my !== renderToken) return;
  let items = feedItems.filter(cut).concat(extra);
  if (offlineNote) { offlineNote = false; toast("ما في إنترنت، عم نعرض آخر أخبار محفوظة"); }
  const seen = new Set(), hidden = state.hidden || {};
  items = items.filter((it) => curCat === "all" ? it.cat !== "reel" : it.cat === curCat)
               .filter((it) => it.link && !hidden[it.link] && !seen.has(it.link) && seen.add(it.link))
               .filter((it) => !seen.has("t:" + it.title) && seen.add("t:" + it.title))
               .sort((a, b) => b.date - a.date);
  const pinned = items.filter((i) => i.pin).sort((a, b) => a.pin - b.pin || b.date - a.date);
  const rest = items.filter((i) => !i.pin), groups = new Map();
  rest.forEach((it) => { if (!groups.has(it.page)) groups.set(it.page, []); groups.get(it.page).push(it); });
  const lists = [...groups.entries()].map(([k, l]) => ({ l, w: WEIGHT[k] || 1, i: 0 })), mixed = [];
  while (mixed.length < rest.length) lists.forEach((o) => { for (let c = 0; c < o.w; c++) if (o.l[o.i]) mixed.push(o.l[o.i++]); });
  items = [...pinned, ...mixed];
  if (curCat === "reel") items = items.slice(0, REELS_PER_DAY);

  if (!items.length) {
    const failed = allFailed;
    list.innerHTML = '<div class="state">' + (failed ? "ما قدرنا نتصل بالإنترنت.<br>تأكد من الاتصال وجرب مرة تانية." : "ما في منشورات هلق.") + '<br><button class="retry" id="retry">إعادة المحاولة</button></div>';
    $("retry").onclick = () => { Object.keys(cache).forEach((k) => delete cache[k]); render(true); };
    return;
  }

  list.innerHTML = "";
  if (curCat === "all" && curPage === "all") list.appendChild(buildWidgets());
  if (curCat === "all" && curPage === "all") minePosts().forEach((n) => list.appendChild(n));
  const footerEl = document.createElement("div");
  list.appendChild(footerEl);
  if (allFailed) { const w = document.createElement("div"); w.className = "state"; w.innerHTML = "ما قدرنا نجيب أخبار جديدة هلق."; list.insertBefore(w, footerEl); }
  let idx = 0;
  const showMore = () => {
    items.slice(idx, idx + MAX_ITEMS).forEach((it) => list.insertBefore(buildCard(it), footerEl));
    idx += MAX_ITEMS;
    if (idx < items.length) {
      footerEl.className = ""; footerEl.innerHTML = '<button class="morebtn" id="more">عرض المزيد</button>';
      footerEl.querySelector("#more").onclick = showMore;
    } else {
      footerEl.className = "caught"; footerEl.innerHTML = svg("check") + (curCat === "reel" ? "خلصت ريلز اليوم، ارجع بكرا" : "لقد شاهدت كل المنشورات الجديدة");
    }
  };
  showMore();
  updateStoryImages();
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
let lastY = 0;
window.addEventListener("scroll", () => {
  const y = window.scrollY, h = $("hdr");
  if (y > lastY + 8 && y > 80) h.classList.add("hide");
  else if (y < lastY - 8 || y <= 0) h.classList.remove("hide");
  lastY = y;
}, { passive: true });
document.querySelector(".logo").onclick = () => { window.scrollTo({ top: 0, behavior: "smooth" }); render(true); };
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - lastRefresh > 10 * 60 * 1000) render(true, true); });
setInterval(() => { if (!document.hidden && Date.now() - lastRefresh > 10 * 60 * 1000) render(true, true); }, 5 * 60 * 1000);
buildCats(); buildStories(); render();
</script>
