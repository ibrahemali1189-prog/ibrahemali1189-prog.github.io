<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>فيس بوك</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --bg:#F0F2F5; --card:#fff; --ink:#050505; --muted:#65676B; --blue:#1877F2; --line:#CED0D4; --soft:#E4E6EB; --size:17px; }
  body.dark { --bg:#18191A; --card:#242526; --ink:#E4E6EB; --muted:#B0B3B8; --blue:#2D88FF; --line:#3E4042; --soft:#3A3B3C; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",Tahoma,Arial,sans-serif; font-size:var(--size); line-height:1.5; }
  svg.ic { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto; }
  button { font:inherit; color:inherit; }
  button:focus-visible, .lp:focus-visible, input:focus-visible { outline:3px solid var(--blue); outline-offset:2px; }

  header { background:var(--card); position:sticky; top:0; z-index:10; }
  .bar { height:56px; padding:0 12px; display:flex; align-items:center; justify-content:space-between; }
  .logo { color:var(--blue); font-weight:800; font-size:1.75em; letter-spacing:-.5px; line-height:1; }
  .tools { display:flex; gap:8px; }
  .tools button { width:40px; height:40px; border:0; border-radius:50%; background:var(--soft); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .tabs { display:flex; border-bottom:1px solid var(--line); }
  .tabs button { flex:1; height:50px; border:0; border-bottom:3px solid transparent; background:none; color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .tabs button svg { width:27px; height:27px; }
  .tabs button[aria-pressed="true"] { color:var(--blue); border-bottom-color:var(--blue); }
  .tabs button[aria-pressed="true"] svg { fill:currentColor; fill-opacity:.15; }
  .sbar { display:none; padding:8px 12px; background:var(--card); border-bottom:1px solid var(--line); }
  .sbar.show { display:block; }
  .sbar input { width:100%; height:40px; border:0; border-radius:20px; padding:0 16px; background:var(--soft); color:var(--ink); font:inherit; font-size:.95em; }

  main { max-width:680px; margin:0 auto; padding-bottom:40px; }
  .composer { background:var(--card); display:flex; align-items:center; gap:8px; padding:10px 12px; margin-bottom:8px; }
  .av { border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; flex:0 0 auto; }
  .composer .av { width:40px; height:40px; background:var(--blue); }
  .composer .pill { flex:1; height:40px; border:1px solid var(--line); border-radius:20px; background:none; color:var(--muted); text-align:right; padding:0 14px; font-size:.95em; cursor:pointer; }
  .composer .photo { width:40px; height:40px; border:0; background:none; color:#45BD62; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .cbox { display:none; background:var(--card); padding:0 12px 12px; margin:-8px 0 8px; }
  .cbox.show { display:block; }
  .cbox textarea { width:100%; min-height:90px; border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--card); color:var(--ink); font:inherit; resize:vertical; }
  .cbox button { margin-top:8px; width:100%; height:42px; border:0; border-radius:8px; background:var(--blue); color:#fff; font-weight:700; cursor:pointer; }

  .stories { display:flex; gap:8px; overflow-x:auto; padding:10px 12px 12px; background:var(--card); margin-bottom:8px; scrollbar-width:none; }
  .stories::-webkit-scrollbar { display:none; }
  .st { flex:0 0 auto; width:104px; height:178px; border:0; border-radius:12px; position:relative; overflow:hidden; cursor:pointer; padding:0; color:#fff; text-align:right; box-shadow:0 1px 3px rgba(0,0,0,.25); }
  .st .sa { position:absolute; top:8px; right:8px; width:38px; height:38px; border:3px solid var(--blue); background:rgba(0,0,0,.25); font-size:.7em; }
  .st .sn { position:absolute; bottom:8px; right:8px; left:8px; font-size:.78em; font-weight:700; line-height:1.3; text-shadow:0 1px 3px rgba(0,0,0,.6); }
  .st[aria-pressed="true"] { outline:3px solid var(--blue); outline-offset:-3px; }
  .st.create { background:var(--card); color:var(--ink); border:1px solid var(--line); box-shadow:none; }
  .st.create .top { height:68%; background:var(--soft); display:flex; align-items:center; justify-content:center; }
  .st.create .top .av { width:62px; height:62px; background:var(--blue); font-size:1.4em; }
  .st.create .plus { position:absolute; top:calc(68% - 16px); left:50%; transform:translateX(-50%); width:32px; height:32px; border-radius:50%; background:var(--blue); color:#fff; border:3px solid var(--card); display:flex; align-items:center; justify-content:center; }
  .st.create .plus svg { width:18px; height:18px; stroke-width:3; }
  .st.create .sn { text-shadow:none; bottom:10px; text-align:center; }

  article { background:var(--card); margin-bottom:8px; position:relative; }
  @media (min-width:700px){ article,.stories,.composer{ border-radius:10px; } }
  .head { display:flex; align-items:center; gap:8px; padding:12px 12px 6px; }
  .head .av { width:40px; height:40px; font-size:.8em; }
  .hm { flex:1; min-width:0; }
  .name { font-weight:700; line-height:1.25; font-size:.95em; }
  .when { color:var(--muted); font-size:.78em; line-height:1.3; display:flex; align-items:center; gap:4px; }
  .when svg { width:12px; height:12px; stroke-width:2.2; }
  .hb { display:flex; }
  .hb button { width:36px; height:36px; border:0; background:none; color:var(--muted); font-size:1.1em; border-radius:50%; cursor:pointer; }
  .hb button:active { background:var(--soft); }
  .text { padding:2px 12px 10px; font-size:1em; line-height:1.55; }
  .text:empty { display:none; }
  .lp { cursor:pointer; background:var(--soft); }
  .lp img { display:block; width:100%; max-height:360px; object-fit:cover; background:var(--line); }
  .lpb { padding:8px 12px 10px; }
  .dom { color:var(--muted); font-size:.72em; text-transform:uppercase; letter-spacing:.2px; direction:ltr; text-align:right; }
  .lpt { font-weight:600; font-size:.98em; line-height:1.5; }
  .vid { position:relative; cursor:pointer; background:#000; }
  .vid img { display:block; width:100%; max-height:360px; object-fit:cover; opacity:.92; }
  .vid .play { position:absolute; inset:0; margin:auto; width:64px; height:64px; border-radius:50%; background:rgba(0,0,0,.6); color:#fff; display:flex; align-items:center; justify-content:center; font-size:1.8em; }
  .vid iframe { display:block; width:100%; aspect-ratio:16/9; border:0; }
  .counts { display:flex; justify-content:space-between; color:var(--muted); font-size:.82em; padding:8px 12px 6px; min-height:6px; }
  .counts:empty { display:none; }
  .actions { display:flex; border-top:1px solid var(--line); margin:0 12px; padding:2px 0; }
  .actions button { flex:1; height:44px; border:0; background:none; color:var(--muted); font-weight:600; font-size:.88em; border-radius:6px; display:flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; user-select:none; -webkit-user-select:none; }
  .actions button svg { width:21px; height:21px; }
  .actions button:active { background:var(--soft); }
  .actions button.on { color:var(--blue); }
  .react-pick { display:none; position:absolute; right:12px; bottom:52px; background:var(--card); border-radius:40px; box-shadow:0 2px 12px rgba(0,0,0,.35); padding:6px 8px; z-index:3; }
  .react-pick.show { display:flex; }
  .react-pick button { border:0; background:none; font-size:1.8em; cursor:pointer; padding:0 5px; line-height:1.3; }
  .comments { display:none; padding:4px 12px 12px; }
  .comments.show { display:block; }
  .cm { display:flex; gap:8px; margin-bottom:8px; align-items:flex-start; }
  .cm .av { width:32px; height:32px; background:var(--blue); font-size:.75em; }
  .cm .bub { background:var(--soft); border-radius:18px; padding:6px 12px; font-size:.9em; }
  .cm .bub b { display:block; font-size:.9em; }
  .cm-form { display:flex; gap:8px; margin-top:6px; }
  .cm-form input { flex:1; height:42px; border:0; border-radius:21px; padding:0 14px; background:var(--soft); color:var(--ink); font:inherit; font-size:.92em; }
  .cm-form button { height:42px; padding:0 16px; border:0; border-radius:21px; background:var(--blue); color:#fff; font-weight:700; cursor:pointer; }

  .state { text-align:center; padding:36px 16px; color:var(--muted); }
  .morebtn { display:block; width:calc(100% - 24px); margin:4px 12px 8px; height:44px; border:0; border-radius:8px; background:var(--soft); color:var(--blue); font-weight:700; cursor:pointer; }
  .retry { margin-top:12px; height:42px; padding:0 22px; border:0; border-radius:8px; background:var(--blue); color:#fff; font-weight:700; cursor:pointer; }
  .caught { text-align:center; padding:26px 16px; color:var(--muted); font-size:.9em; }
  .caught svg { width:40px; height:40px; color:var(--blue); display:block; margin:0 auto 6px; }
  .wcard { background:var(--card); margin-bottom:8px; padding:6px 12px 10px; }
  .wrow { padding:8px 0; border-bottom:1px solid var(--line); }
  .wrow:last-child { border-bottom:0; }
  .wrow:empty { display:none; }
  .wlabel { color:var(--muted); font-size:.75em; margin-bottom:4px; }
  .wtop { display:flex; align-items:center; gap:10px; }
  .wtop .big { font-size:2em; line-height:1; }
  .wtop b { font-size:1.05em; }
  .wtop span { color:var(--muted); font-size:.85em; }
  .chips { display:flex; gap:6px; }
  .chip { flex:1; text-align:center; background:var(--bg); border-radius:10px; padding:4px 2px; line-height:1.3; }
  .chip small { display:block; color:var(--muted); font-size:.7em; }
  .chip b { font-size:.88em; direction:ltr; display:inline-block; }
  .chip.next { background:var(--blue); color:#fff; }
  .chip.next small { color:#fff; opacity:.9; }
  .prices { display:flex; gap:8px; }
  .prices div { flex:1; background:var(--bg); border-radius:10px; padding:6px 10px; line-height:1.35; }
  .prices small { display:block; color:var(--muted); font-size:.7em; }
  .prices b { font-size:.95em; }
  .wnote { color:var(--muted); font-size:.68em; margin-top:4px; }
  article img.pic { display:block; width:100%; max-height:360px; object-fit:cover; background:var(--line); }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:10px 20px; border-radius:24px; font-size:.85em; display:none; z-index:30; }
</style>
</head>

/* أدوات */
function clean(html) { const d = document.createElement("div"); d.innerHTML = html || ""; return (d.textContent || "").replace(/\s+/g, " ").trim(); }
function firstImg(html) { const m = /<img[^>]+src=["']([^"']+)["']/i.exec(html || ""); return m ? m[1] : ""; }
function parseDate(s) {
  if (!s) return new Date(0);
  const d = /^\d{4}-\d{2}-\d{2} /.test(s) ? new Date(s.replace(" ", "T") + "Z") : new Date(s);
  return isNaN(d) ? new Date(0) : d;
}
function ago(d) {
  const m = Math.round((Date.now() - d.getTime()) / 60000);
  if (m < 1) return "الآن"; if (m < 60) return m + " د";
  const h = Math.round(m / 60); if (h < 24) return h + " س";
  return Math.round(h / 24) + " ي";
}
function classify(text) {
  for (const c of ["sport", "health"]) if (KEYWORDS[c].some((w) => text.includes(w))) return c;
  return "news";
}

/* جلب الـ RSS */
async function viaRss2Json(url) {
  const r = await fetch("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(url));
  const j = await r.json();
  if (j.status !== "ok") throw new Error("rss2json");
  return j.items.map((it) => ({ title: it.title, desc: it.description, link: it.link, pub: it.pubDate, img: it.thumbnail || (it.enclosure && it.enclosure.link) || firstImg(it.description) || firstImg(it.content) }));
}
async function viaAllOrigins(url) {
  const r = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(url));
  const xml = new DOMParser().parseFromString(await r.text(), "text/xml");
  const items = [...xml.querySelectorAll("item, entry")];
  if (!items.length) throw new Error("allorigins");
  const g = (el, t) => { const n = el.getElementsByTagName(t)[0]; return n ? n.textContent : ""; };
  return items.map((el) => {
    const enc = el.getElementsByTagName("enclosure")[0];
    const th = el.getElementsByTagName("media:thumbnail")[0] || el.getElementsByTagName("media:content")[0];
    const desc = g(el, "description") || g(el, "media:description");
    const lk = el.getElementsByTagName("link")[0];
    return { title: g(el, "title"), desc, link: g(el, "link") || (lk ? lk.getAttribute("href") : ""), pub: g(el, "pubDate") || g(el, "published"), img: (enc && enc.getAttribute("url")) || (th && th.getAttribute("url")) || firstImg(desc) || firstImg(g(el, "content:encoded")) };
  });
}
/* حفظ آخر أخبار عالجهاز لتظهر بدون إنترنت */
const KEEP = "feed:";
let offlineNote = false;
function saveFeed(url, items) { try { localStorage.setItem(KEEP + url, JSON.stringify(items.slice(0, 40))); } catch {} }
function readFeed(url) {
  try { const t = localStorage.getItem(KEEP + url); if (!t) return null; return JSON.parse(t).map((i) => ({ ...i, date: new Date(i.date) })); }
  catch { return null; }
}
async function loadFeed(f) {
  if (cache[f.url]) return cache[f.url];
  let raw;
  try { raw = await viaRss2Json(f.url); }
  catch {
    try { raw = await viaAllOrigins(f.url); }
    catch (e) {
      const old = readFeed(f.url);
      if (old) { offlineNote = true; cache[f.url] = old; return old; }
      throw e;
    }
  }
  const items = raw.map((it) => {
    let title = clean(it.title), summary = clean(it.desc).slice(0, 180);
    if (f.gn) { title = title.replace(/\s+-\s+[^-]+$/, ""); summary = ""; }
    const vm = /(?:v=|\/embed\/|youtu\.be\/)([\w-]{11})/.exec(it.link || "");
    return { page: f.page, title, summary, link: it.link, img: it.img || "", date: parseDate(it.pub),
             vid: f.cat === "video" && vm ? vm[1] : "", topic: f.topic || "",
             cat: f.cat !== "news" ? f.cat : classify(title + " " + summary) };
  });
  cache[f.url] = items;
  saveFeed(f.url, items);
  return items;
}

      f.allow = "autoplay; encrypted-media; fullscreen"; f.allowFullscreen = true;
      box.innerHTML = ""; box.onclick = null; box.style.cursor = "default"; box.appendChild(f);
    };
    box.onclick = play; media.appendChild(box);
  } else if (it.plain) {
    text.textContent = it.summary;
    if (it.img) { const im = document.createElement("img"); im.className = "pic"; im.alt = ""; im.loading = "lazy"; im.src = it.img; im.onerror = () => im.remove(); media.appendChild(im); }
  } else {
    text.textContent = it.summary;
    const lp = document.createElement("div"); lp.className = "lp"; lp.tabIndex = 0; lp.setAttribute("role", "link");
    if (it.img) { const img = document.createElement("img"); img.alt = ""; img.loading = "lazy"; img.src = it.img; img.onerror = () => img.remove(); lp.appendChild(img); }
    lp.insertAdjacentHTML("beforeend", '<div class="lpb"><div class="dom"></div><div class="lpt"></div></div>');
    lp.querySelector(".dom").textContent = DOM[it.page] || "youtube.com";
    lp.querySelector(".lpt").textContent = it.title;
    const go = () => window.open(it.link, "_blank", "noopener");
    lp.onclick = go; lp.onkeydown = (e) => { if (e.key === "Enter") go(); };
    media.appendChild(lp);
  }

  a.querySelector(".more").onclick = async () => { try { await navigator.clipboard.writeText(it.plain ? it.summary : it.link); toast("تم النسخ"); } catch { toast("تعذر النسخ"); } };
  a.querySelector(".x").onclick = () => { (state.hidden = state.hidden || {})[it.link] = 1; save(); a.remove(); };

  const pick = a.querySelector(".react-pick");
  REACTS.forEach(([e, n]) => {
    const b = document.createElement("button"); b.textContent = e; b.setAttribute("aria-label", n);
    b.onclick = () => { st(it.link).r = e; save(); pick.classList.remove("show"); refreshCounts(a, it.link); };
    pick.appendChild(b);
  });
  const like = a.querySelector(".like"); let timer = null, long = false;
  const start = () => { long = false; timer = setTimeout(() => { long = true; pick.classList.add("show"); }, 450); };
  const end = () => clearTimeout(timer);
  like.addEventListener("pointerdown", start); like.addEventListener("pointerup", end);
  like.addEventListener("pointerleave", end); like.addEventListener("pointercancel", end);
  like.addEventListener("contextmenu", (e) => e.preventDefault());
  like.onclick = () => {
    if (long) { long = false; return; }
    const s = st(it.link); s.r = s.r ? "" : "👍"; save(); pick.classList.remove("show"); refreshCounts(a, it.link);

      else { await navigator.clipboard.writeText(it.link); toast("تم نسخ الرابط"); }
    } catch {}
  };

  return a;
}

/* ===== منشورات العيلة (من ملف family.json) والنصائح اليومية ===== */
function localDate(s) {
  if (!s) return new Date();
  const d = new Date(String(s).replace(" ", "T"));
  return isNaN(d) ? new Date() : d;
}
async function loadFamily() {
  let arr = null;
  try { const r = await fetch("family.json?t=" + Date.now(), { cache: "no-store" }); if (r.ok) arr = await r.json(); } catch {}
  if (Array.isArray(arr)) store.set("family", JSON.stringify(arr));
  else { try { arr = JSON.parse(store.get("family", "[]")); } catch { arr = []; } }
  const withImg = arr.slice().sort((a, b) => localDate(b.date) - localDate(a.date)).find((p) => p.image);
  if (withImg) storyImg.fam = withImg.image;
  return arr.map((p, i) => ({
    page: "fam", plain: true, pin: 1, by: p.by || "", summary: String(p.text || ""), title: String(p.text || "").slice(0, 60),
    img: p.image || "", date: localDate(p.date), link: "fam:" + (p.date || "") + ":" + i, cat: "all"
  })).sort((a, b) => b.date - a.date);
}
function tipItem(k) {
  const day = Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 86400000) - k;
  const idx = ((day % TIPS.length) + TIPS.length) % TIPS.length;
  const d = new Date(); d.setHours(8, 0, 0, 0); d.setDate(d.getDate() - k);
  return { page: "tip", plain: true, pin: 2, by: "", summary: "نصيحة اليوم: " + TIPS[idx], title: TIPS[idx].slice(0, 60), img: "", date: d, link: "tip:" + day, cat: "all" };
}
async function extras() {
  const out = [];
  if (curCat !== "all") return out;
  if (curPage === "all") { out.push(...(await loadFamily()).slice(0, 5)); out.push(tipItem(0)); }
  else if (curPage === "fam") out.push(...(await loadFamily()).slice(0, 30));
  else if (curPage === "tip") for (let k = 0; k < 5; k++) out.push(tipItem(k));
  return out;
}

});
const n0 = (x) => Math.round(x).toLocaleString("en-US");
const t12 = (hhmm) => { const [h, m] = hhmm.split(":").map(Number); return ((h % 12) || 12) + ":" + String(m).padStart(2, "0"); };

function buildWidgets() {
  const el = document.createElement("div"); el.className = "wcard";
  el.innerHTML = '<div class="wrow w1"></div><div class="wrow w2"></div><div class="wrow w3"></div>';
  getWeather().then((w) => {
    if (!w) return; const v = w.v, [ic, nm] = WCODE(v.code);
    el.querySelector(".w1").innerHTML = '<div class="wtop"><div class="big"></div><div><b></b><br><span></span></div></div>';
    el.querySelector(".big").textContent = ic;
    el.querySelector("b").textContent = CITY + " · " + v.t + "°";
    el.querySelector(".wtop span").textContent = nm + " · العظمى " + v.max + "° والصغرى " + v.min + "°";
  });
  getPrayer().then((p) => {
    if (!p) return; const v = p.v;
    const list = [["الفجر", v.Fajr], ["الظهر", v.Dhuhr], ["العصر", v.Asr], ["المغرب", v.Maghrib], ["العشاء", v.Isha]];
    const nowM = new Date().getHours() * 60 + new Date().getMinutes();
    let next = list.findIndex(([, t]) => { const [h, m] = t.split(":").map(Number); return h * 60 + m > nowM; }); if (next < 0) next = 0;
    const box = el.querySelector(".w2"); box.innerHTML = '<div class="wlabel">مواعيد الصلاة</div><div class="chips"></div>';
    list.forEach(([nm, t], i) => { const c = document.createElement("div"); c.className = "chip" + (i === next ? " next" : ""); c.innerHTML = "<small></small><b></b>"; c.querySelector("small").textContent = nm; c.querySelector("b").textContent = t12(t); box.querySelector(".chips").appendChild(c); });
  });
  getPrices().then((p) => {
    if (!p) return; const v = p.v, m = v.manual || {}, cells = [];
    if (m.usd_syp) cells.push(["الدولار", n0(m.usd_syp) + " ل.س"]);
    else if (v.syp) cells.push(["الدولار (سعر رسمي)", n0(v.syp) + " ل.س"]);
    if (m.gold21_syp) cells.push(["غرام الذهب عيار 21", n0(m.gold21_syp) + " ل.س"]);
    else if (v.xau) cells.push(["غرام الذهب 21 (عالمي)", "$" + n0(v.xau / 31.1035 * 0.875)]);
    if (!cells.length) return;
    const box = el.querySelector(".w3"); box.innerHTML = '<div class="prices"></div><div class="wnote"></div>';
    cells.forEach(([l, val]) => { const d = document.createElement("div"); d.innerHTML = "<small></small><b></b>"; d.querySelector("small").textContent = l; d.querySelector("b").textContent = val; box.querySelector(".prices").appendChild(d); });
    box.querySelector(".wnote").textContent = m.date ? "آخر تحديث: " + m.date : "الأسعار تقريبية، تأكد من السوق";
  });
  return el;
}

async function render() {
  const list = $("list");
  list.innerHTML = '<div class="state">جارٍ التحميل…</div>';
  const feeds = FEEDS.filter((f) => (curPage === "all" || f.page === curPage) && (curCat === "all" || f.cat === curCat || f.cat === "news"));
  const results = await Promise.allSettled(feeds.map(loadFeed));
  let items = results.filter((r) => r.status === "fulfilled").flatMap((r) => r.value).concat(await extras());
  const allFailed = results.length > 0 && results.every((r) => r.status === "rejected");
  if (offlineNote) { offlineNote = false; toast("ما في إنترنت، عم نعرض آخر أخبار محفوظة"); }

  const seen = new Set(), hidden = state.hidden || {};
  items = items.filter((it) => curCat === "all" || it.cat === curCat)
               .filter((it) => it.link && !hidden[it.link] && !seen.has(it.link) && seen.add(it.link))
               .filter((it) => !seen.has("t:" + it.title) && seen.add("t:" + it.title))
               .sort((a, b) => b.date - a.date);
  const pinned = items.filter((i) => i.pin).sort((a, b) => a.pin - b.pin || b.date - a.date);
  items = [...pinned, ...items.filter((i) => !i.pin)];

  if (!items.length) {
    const failed = allFailed;
    list.innerHTML = '<div class="state">' + (failed ? "ما قدرنا نتصل بالإنترنت.<br>تأكد من الاتصال وجرب مرة تانية." : "ما في منشورات هلق.") + '<br><button class="retry" id="retry">إعادة المحاولة</button></div>';
    $("retry").onclick = () => { Object.keys(cache).forEach((k) => delete cache[k]); render(); };
    return;
  }

  list.innerHTML = "";
  if (curCat === "all" && curPage === "all") list.appendChild(buildWidgets());
  if (curCat === "all" && curPage === "all") minePosts().forEach((n) => list.appendChild(n));
  const footerEl = document.createElement("div");
  list.appendChild(footerEl);
  if (allFailed) { const w = document.createElement("div"); w.className = "state"; w.innerHTML = "ما قدرنا نجيب أخبار جديدة هلق."; list.insertBefore(w, footerEl); }
  let idx = 0;
  const showMore = () => {
    items.slice(idx, idx + MAX_ITEMS).forEach((it) => list.insertBefore(buildCard(it), footerEl));
    idx += MAX_ITEMS;
    if (idx < items.length) {
      footerEl.className = ""; footerEl.innerHTML = '<button class="morebtn" id="more">عرض المزيد</button>';
      footerEl.querySelector("#more").onclick = showMore;
    } else {
      footerEl.className = "caught"; footerEl.innerHTML = svg("check") + "لقد شاهدت كل المنشورات الجديدة";
    }
  };
  showMore();
  updateStoryImages();
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
buildCats(); buildStories(); render();
</script>
</body>
</html>
